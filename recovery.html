<div id="out" style="margin-top:20px; white-space:pre; font-size:12px; max-height:80vh; overflow:auto;"></div>

<script>
const SUPA_URL = 'https://hndsnoindoixrigcbivd.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuZHNub2luZG9peHJpZ2NiaXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2Mjc4NDAsImV4cCI6MjA4ODIwMzg0MH0.TghbRf1CyNb2Ikei2W-D1nQ7qS8IO7ZpIeuEwt4Co0Q';
let sb = null;
const out = () => document.getElementById('out');
const log = (t) => { out().textContent += t + '\n'; };

async function loadSDK() {
    return new Promise(resolve => {
        if (window.supabase) { sb = supabase.createClient(SUPA_URL, SUPA_KEY); return resolve(); }
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        document.head.appendChild(s);
        s.onload = () => { sb = supabase.createClient(SUPA_URL, SUPA_KEY); resolve(); };
    });
}

async function runDiag() {
    out().textContent = '';
    await loadSDK();

    const tables = ['clients', 'orders', 'payments', 'visits', 'objectifs', 'users'];
    for (const t of tables) {
        const { data, error } = await sb.from(t).select('*');
        if (error) log(`❌ ${t}: ERREUR - ${error.message}`);
        else log(`✅ ${t}: ${data.length} enregistrements`);
    }

    log('\n=== DÉTAIL CLIENTS ===');
    const { data: clients } = await sb.from('clients').select('id, nom, type, commune, wilaya, commercial_id, commercial_nom');
    if (!clients || clients.length === 0) {
        log('⚠️  TABLE CLIENTS VIDE !');
    } else {
        clients.forEach(c => {
            log(`  [${c.type||'?'}] ID:${c.id} | ${c.nom} | ${c.commune||'-'} | comm_id: ${c.commercial_id||'NULL'}`);
        });
    }
}

function recoverFromBackup() {
