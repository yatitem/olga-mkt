<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>OLGA — Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../01_Core/olga_config.js"></script>
    <script src="../01_Core/olga_auth.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f4c81 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow: hidden;
        }

        /* ── Fond animé ── */
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            animation: pulse 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
            animation: pulse 8s ease-in-out infinite reverse;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.2)
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 36px 28px;
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 1;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4);
        }

        /* ── Logo ── */
        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }

        .logo h1 {
            color: white;
            font-size: 1.6em;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.82em;
            margin-top: 2px;
        }

        /* ── Indicateur PIN ── */
        .pin-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pin-dot.filled {
            background: white;
            border-color: white;
            transform: scale(1.2);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }

        /* ── Message d'erreur ── */
        .error-msg {
            text-align: center;
            color: #f87171;
            font-size: 0.82em;
            font-weight: 500;
            height: 20px;
            margin-bottom: 16px;
            transition: opacity 0.3s;
        }

        /* ── Clavier ── */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key {
            aspect-ratio: 1;
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.4em;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .key::after {
            content: '';
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            transition: opacity 0.1s;
            border-radius: inherit;
        }

        .key:active::after {
            opacity: 0.15;
        }

        .key:active {
            transform: scale(0.94);
        }

        .key .sub {
            font-size: 0.35em;
            letter-spacing: 0.1em;
            opacity: 0.5;
            margin-top: 2px;
            font-weight: 400;
        }

        .key-empty {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }

        .key-delete {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .key-delete:active {
            background: rgba(239, 68, 68, 0.3);
        }

        .key-confirm {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
        }

        .key-confirm:active {
            transform: scale(0.96);
        }

        /* ── Shake animation ── */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            20% {
                transform: translateX(-8px)
            }

            40% {
                transform: translateX(8px)
            }

            60% {
                transform: translateX(-6px)
            }

            80% {
                transform: translateX(6px)
            }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        /* ── Loading ── */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .loading-overlay.visible {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-overlay p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.72em;
            margin-top: 20px;
            z-index: 1;
        }

        /* ── Tentatives ── */
        .attempts-warning {
            text-align: center;
            color: #fbbf24;
            font-size: 0.78em;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .attempts-warning.visible {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="card" id="card">
        <!-- Loading overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>Vérification en cours…</p>
        </div>

        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">🧴</div>
            <h1>OLGA</h1>
            <p>Système commercial</p>
        </div>

        <!-- PIN dots -->
        <div class="pin-display" id="pinDisplay">
            <div class="pin-dot" id="d0"></div>
            <div class="pin-dot" id="d1"></div>
            <div class="pin-dot" id="d2"></div>
            <div class="pin-dot" id="d3"></div>
            <div class="pin-dot" id="d4"></div>
            <div class="pin-dot" id="d5"></div>
        </div>

        <!-- Erreur -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- Clavier -->
        <div class="keypad" id="keypad">
            <button class="key" onclick="addDigit('1')">1<span class="sub"></span></button>
            <button class="key" onclick="addDigit('2')">2<span class="sub">ABC</span></button>
            <button class="key" onclick="addDigit('3')">3<span class="sub">DEF</span></button>
            <button class="key" onclick="addDigit('4')">4<span class="sub">GHI</span></button>
            <button class="key" onclick="addDigit('5')">5<span class="sub">JKL</span></button>
            <button class="key" onclick="addDigit('6')">6<span class="sub">MNO</span></button>
            <button class="key" onclick="addDigit('7')">7<span class="sub">PQRS</span></button>
            <button class="key" onclick="addDigit('8')">8<span class="sub">TUV</span></button>
            <button class="key" onclick="addDigit('9')">9<span class="sub">WXYZ</span></button>
            <button class="key key-empty" disabled></button>
            <button class="key" onclick="addDigit('0')">0</button>
            <button class="key key-delete" onclick="deleteDigit()">⌫</button>
        </div>

        <div class="attempts-warning" id="attemptsWarning"></div>
    </div>

    <div class="footer">OLGA © 2026 — Accès sécurisé</div>

    <script>
        // ── Si déjà connecté → rediriger ──────────────────────────
        const existingSession = OLGA_AUTH.getSession();
        if (existingSession) OLGA_AUTH.redirectByRole(existingSession);

        let pin = '';
        let attempts = 0;
        const MAX_ATTEMPTS = 5;
        const PIN_LENGTH = 4; // PIN à 4 chiffres minimum, 6 max

        function updateDots() {
            for (let i = 0; i < 6; i++) {
                const dot = document.getElementById('d' + i);
                dot.classList.toggle('filled', i < pin.length);
            }
        }

        function addDigit(d) {
            if (pin.length >= 6) return;
            pin += d;
            updateDots();
            clearError();
            // Auto-submit à 4+ chiffres si l'entrée parait terminée
            // Laisser l'utilisateur valider avec ⏎ pour les PIN de 5-6 digits
            // Pour PIN de 4: auto-submit
            if (pin.length === PIN_LENGTH) {
                setTimeout(submitPin, 200);
            }
        }

        function deleteDigit() {
            pin = pin.slice(0, -1);
            updateDots();
            clearError();
        }

        async function submitPin() {
            if (pin.length < 4) { showError('PIN trop court (min 4 chiffres)'); return; }
            if (attempts >= MAX_ATTEMPTS) { showError('Compte bloque'); return; }
            showLoading(true);
            disableKeypad(true);
            let result = null;
            // SETUP_MODE : login local si backend pas encore mis a jour
            if (OLGA_CONFIG.SETUP_MODE) {
                const match = (OLGA_CONFIG.SETUP_USERS || []).find(u => u.pin === pin);
                if (match) {
                    const safeUser = { id: match.id, prenom: match.prenom, nom: match.nom, role: match.role, secteur: match.secteur };
                    sessionStorage.setItem('olga_user', JSON.stringify(safeUser));
                    sessionStorage.setItem('olga_ts', Date.now().toString());
                    result = { success: true, user: safeUser };
                } else {
                    result = { error: 'PIN incorrect' };
                }
            } else {
                result = await OLGA_AUTH.login(pin);
            }
            showLoading(false);
            if (result.success) {
                document.getElementById('card').style.borderColor = 'rgba(16,185,129,0.5)';
                OLGA_AUTH.redirectByRole(result.user);
            } else {
                attempts++;
                pin = '';
                updateDots();
                disableKeypad(false);
                showError(result.error || 'PIN incorrect');
                shakeDisplay();
                if (attempts >= MAX_ATTEMPTS - 1) {
                    const warn = document.getElementById('attemptsWarning');
                    warn.textContent = '⚠️ ' + (MAX_ATTEMPTS - attempts) + ' tentative(s) restante(s)';
                    warn.classList.add('visible');
                }
                if (attempts >= MAX_ATTEMPTS) { disableKeypad(true); showError('Trop de tentatives'); }
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
        }
        function clearError() { document.getElementById('errorMsg').textContent = ''; }
        function showLoading(v) { document.getElementById('loadingOverlay').classList.toggle('visible', v); }
        function disableKeypad(v) { document.querySelectorAll('.key').forEach(k => k.disabled = v); }
        function shakeDisplay() {
            const d = document.getElementById('pinDisplay');
            d.classList.remove('shake');
            void d.offsetWidth; // reflow
            d.classList.add('shake');
        }

        // ── Support clavier physique (desktop) ────────────────────
        document.addEventListener('keydown', e => {
            if (e.key >= '0' && e.key <= '9') addDigit(e.key);
            if (e.key === 'Backspace') deleteDigit();
            if (e.key === 'Enter' && pin.length >= 4) submitPin();
        });
    </script>
</body>

</html>
